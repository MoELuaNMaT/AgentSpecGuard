name: Restore generated README diagrams

on:
  push:
    paths:
      - '.asset-payload/READY'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode and verify original generated diagrams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets

          decode() {
            name="$1"
            expected="$2"
            cat ".asset-payload/${name}.part-"* | tr -d '\n' | base64 -d > "assets/${name}.webp"
            actual="$(git hash-object "assets/${name}.webp")"
            if [ "$actual" != "$expected" ]; then
              echo "SHA mismatch for ${name}: expected ${expected}, got ${actual}" >&2
              exit 1
            fi
          }

          decode without-agent-spec-guard-en dbb51f90bd739a869ba4f289bb60e2f98ee98a96
          decode with-agent-spec-guard-en 5589fd62ac0f030c3ace640ee009e66111e833ed
          decode without-agent-spec-guard-zh 77b572fbf7d18124ac66faf1865d966a0b1b806c
          decode with-agent-spec-guard-zh 27120f15311cef10eddd72e744dd738607dacc9d

          sed -i \
            -e 's/without-agent-spec-guard-en\.svg/without-agent-spec-guard-en.webp/g' \
            -e 's/with-agent-spec-guard-en\.svg/with-agent-spec-guard-en.webp/g' \
            -e 's/without-agent-spec-guard-zh\.svg/without-agent-spec-guard-zh.webp/g' \
            -e 's/with-agent-spec-guard-zh\.svg/with-agent-spec-guard-zh.webp/g' \
            README.md README.zh-CN.md

          rm -f assets/*.svg

      - name: Commit restored diagrams
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md assets
          git rm -r .asset-payload .github/workflows/restore-generated-diagrams.yml
          git commit -m "Use original generated diagrams in README"
          git push
