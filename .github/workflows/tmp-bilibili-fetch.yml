name: Temporary Bilibili Fetch

on:
  push:
    branches:
      - tmp-bilibili-BV1Tit86MECG

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install media tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install -U requests faster-whisper

      - name: Resolve and download video through relay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          import json, pathlib, requests, urllib.parse
          BV='BV1Tit86MECG'
          PAGE=f'https://www.bilibili.com/video/{BV}/'
          api='https://api.mir6.com/api/bzjiexi?'+urllib.parse.urlencode({'url':PAGE,'type':'json'})
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.bilibili.com/'})
          r=s.get(api,timeout=30); r.raise_for_status(); d=r.json()
          pathlib.Path('out/meta.json').write_text(json.dumps(d,ensure_ascii=False,indent=2),encoding='utf-8')
          print('TITLE:',d.get('title'))
          print('DESC:',d.get('desc'))
          items=d.get('data') or []
          if not items: raise SystemExit('Relay returned no video items')
          url=items[0].get('video_url') or items[0].get('url')
          if not url: raise SystemExit('Relay returned no media URL')
          pathlib.Path('out/media_source.txt').write_text(url,encoding='utf-8')
          with s.get(url,stream=True,timeout=60) as rr:
              rr.raise_for_status()
              with open('out/video.mp4','wb') as f:
                  for chunk in rr.iter_content(1024*1024):
                      if chunk: f.write(chunk)
          print('VIDEO_BYTES:',pathlib.Path('out/video.mp4').stat().st_size)
          PY

      - name: Extract audio and keyframes
        run: |
          ffmpeg -hide_banner -loglevel warning -y -i out/video.mp4 -vn -ac 1 -ar 16000 out/audio.wav
          mkdir -p out/frames
          ffmpeg -hide_banner -loglevel warning -y -i out/video.mp4 -vf "fps=1/120,scale=640:-2" -q:v 3 out/frames/frame_%02d.jpg

      - name: Transcribe with Whisper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from faster_whisper import WhisperModel
          model=WhisperModel('small',device='cpu',compute_type='int8')
          segments,info=model.transcribe('out/audio.wav',language='zh',vad_filter=True,beam_size=5)
          lines=[]; timed=[]
          for s in segments:
              t=s.text.strip()
              if not t: continue
              lines.append(t)
              timed.append(f'[{s.start:8.2f}-{s.end:8.2f}] {t}')
          Path('out/transcript.txt').write_text('\n'.join(lines),encoding='utf-8')
          Path('out/transcript_timed.txt').write_text('\n'.join(timed),encoding='utf-8')
          print('ASR_LANGUAGE:',info.language,'PROB:',info.language_probability,'SEGMENTS:',len(lines))
          print('===== TRANSCRIPT =====')
          print('\n'.join(lines))
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-BV1Tit86MECG-final
          path: |
            out/meta.json
            out/media_source.txt
            out/transcript.txt
            out/transcript_timed.txt
            out/frames/*.jpg
          if-no-files-found: warn
          retention-days: 1
