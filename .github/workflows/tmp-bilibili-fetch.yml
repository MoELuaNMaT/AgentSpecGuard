name: Temporary Bilibili Fetch

on:
  push:
    branches:
      - tmp-bilibili-BV1Tit86MECG

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch via Bilibili public APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          BVID='BV1Tit86MECG'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152.0.0.0 Safari/537.36'
          HDR=(-H "User-Agent: $UA" -H 'Referer: https://www.bilibili.com/')

          curl -fL --retry 3 "${HDR[@]}" "https://api.bilibili.com/x/web-interface/view?bvid=$BVID" -o out/view.json

          CID=$(python - <<'PY'
          import json
          d=json.load(open('out/view.json',encoding='utf-8'))
          print(d['data']['pages'][0]['cid'])
          PY
          )
          echo "CID=$CID"

          curl -fL --retry 3 "${HDR[@]}" "https://api.bilibili.com/x/player/v2?bvid=$BVID&cid=$CID" -o out/player.json || true
          curl -fL --retry 3 "${HDR[@]}" "https://api.bilibili.com/x/player/playurl?bvid=$BVID&cid=$CID&qn=64&fnval=16&fnver=0&fourk=1" -o out/playurl.json

          python - <<'PY'
          import json
          v=json.load(open('out/view.json',encoding='utf-8'))['data']
          out={
              'bvid':v.get('bvid'),'aid':v.get('aid'),'title':v.get('title'),'desc':v.get('desc'),
              'duration':v.get('duration'),'pubdate':v.get('pubdate'),'owner':v.get('owner'),'stat':v.get('stat'),
              'pages':v.get('pages')
          }
          open('out/meta.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Try native subtitle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.request
          p=pathlib.Path('out/player.json')
          if not p.exists() or not p.stat().st_size:
              raise SystemExit(0)
          d=json.load(open(p,encoding='utf-8'))
          subs=((d.get('data') or {}).get('subtitle') or {}).get('subtitles') or []
          if not subs:
              print('No native subtitle listed')
              raise SystemExit(0)
          s=subs[0]
          u=s.get('subtitle_url') or ''
          if u.startswith('//'): u='https:'+u
          req=urllib.request.Request(u, headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.bilibili.com/'})
          body=json.loads(urllib.request.urlopen(req,timeout=30).read().decode('utf-8'))
          lines=[]; timed=[]
          for x in body.get('body',[]):
              t=(x.get('content') or '').strip()
              if t:
                  lines.append(t)
                  timed.append(f"[{x.get('from',0):8.2f}-{x.get('to',0):8.2f}] {t}")
          pathlib.Path('out/transcript.txt').write_text('\n'.join(lines),encoding='utf-8')
          pathlib.Path('out/transcript_timed.txt').write_text('\n'.join(timed),encoding='utf-8')
          print('Native subtitle lines:',len(lines),'lang:',s.get('lan_doc') or s.get('lan'))
          PY

      - name: Download audio from playurl when subtitle missing
        shell: bash
        run: |
          set -euo pipefail
          if [ -s out/transcript.txt ]; then
            echo 'Native subtitle found; audio download not needed.'
            exit 0
          fi
          python - <<'PY'
          import json, pathlib, urllib.request
          d=json.load(open('out/playurl.json',encoding='utf-8'))
          data=d.get('data') or {}
          url=None
          dash=data.get('dash') or {}
          audios=dash.get('audio') or []
          if audios:
              a=max(audios,key=lambda x:x.get('bandwidth',0))
              url=a.get('baseUrl') or a.get('base_url')
          if not url:
              durl=data.get('durl') or []
              if durl: url=durl[0].get('url')
          if not url:
              raise SystemExit('No downloadable media URL in playurl response')
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.bilibili.com/'})
          with urllib.request.urlopen(req,timeout=60) as r, open('out/audio.bin','wb') as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          print('Downloaded bytes:',pathlib.Path('out/audio.bin').stat().st_size)
          PY
          ffmpeg -hide_banner -loglevel error -y -i out/audio.bin -vn -ac 1 -ar 16000 out/audio.wav

      - name: Whisper ASR fallback
        shell: bash
        run: |
          set -euo pipefail
          if [ -s out/transcript.txt ]; then
            echo 'Transcript already available.'
            exit 0
          fi
          python -m pip install -U faster-whisper
          python - <<'PY'
          from pathlib import Path
          from faster_whisper import WhisperModel
          model=WhisperModel('small',device='cpu',compute_type='int8')
          segments,info=model.transcribe('out/audio.wav',language='zh',vad_filter=True,beam_size=5)
          lines=[]; timed=[]
          for s in segments:
              t=s.text.strip()
              if not t: continue
              lines.append(t)
              timed.append(f'[{s.start:8.2f}-{s.end:8.2f}] {t}')
          Path('out/transcript.txt').write_text('\n'.join(lines),encoding='utf-8')
          Path('out/transcript_timed.txt').write_text('\n'.join(timed),encoding='utf-8')
          print('ASR language:',info.language,'prob:',info.language_probability,'segments:',len(lines))
          PY

      - name: Print result
        if: always()
        shell: bash
        run: |
          echo '===== META ====='
          cat out/meta.json 2>/dev/null || true
          echo '===== TRANSCRIPT ====='
          cat out/transcript.txt 2>/dev/null || true
          echo '===== VIEW DEBUG ====='
          cat out/view.json 2>/dev/null || true
          echo '===== PLAYER DEBUG ====='
          cat out/player.json 2>/dev/null || true
          echo '===== PLAYURL DEBUG ====='
          cat out/playurl.json 2>/dev/null || true

      - name: Upload text artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bilibili-BV1Tit86MECG-api
          path: |
            out/meta.json
            out/transcript.txt
            out/transcript_timed.txt
            out/view.json
            out/player.json
            out/playurl.json
          if-no-files-found: warn
          retention-days: 1
