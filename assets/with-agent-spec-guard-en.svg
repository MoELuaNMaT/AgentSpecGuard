#2563eb">Question:</text><text x="449" y="520" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500" fill="#0f172a"><tspan x="449" dy="0">Local username/password</tspan><tspan x="449" dy="1.35em">or Google login?</tspan></text><line x1="443" y1="602" x2="757" y2="602" stroke="#bfdbfe" stroke-width="2"/><text x="449" y="660" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#2563eb">Why I’m asking:</text><text x="449" y="730" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500" fill="#0f172a"><tspan x="449" dy="0">This changes the auth</tspan><tspan x="449" dy="1.35em">architecture.</tspan></text><g stroke="#2563eb" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="812" y1="520" x2="864" y2="520"/><path d="M 850 502 L 880 520 L 850 538"/></g><rect x="890" y="260" width="230" height="480" rx="28" fill="#fff" stroke="#2563eb" stroke-width="3" opacity="1" filter="url(#shadow)"/><circle cx="1005.0" cy="346" r="42" fill="#eff6ff"/><text x="1005.0" y="358" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" fill="#2563eb" text-anchor="middle">U</text><text x="1005.0" y="423" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="700" fill="#2563eb" text-anchor="middle">YOU</text><line x1="930" y1="465" x2="1080" y2="465" stroke="#bfdbfe" stroke-width="3"/><text x="938" y="560" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="500" fill="#111827"><tspan x="938" dy="0">Local</tspan><tspan x="938" dy="1.35em">username/</tspan><tspan x="938" dy="1.35em">password.</tspan></text><g stroke="#2563eb" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="1130" y1="520" x2="1182" y2="520"/><path d="M 1168 502 L 1198 520 L 1168 538"/></g><rect x="1210" y="260" width="340" height="480" rx="28" fill="#ffffff" stroke="#22c55e" stroke-width="3" opaci