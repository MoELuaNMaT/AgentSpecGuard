<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#fff"/><text x="800" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="72" font-weight="800" fill="#0f172a">使用 AgentSpecGuard</text><text x="800" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" fill="#475569">只追问关键歧义，再按最小完整方案实现。</text><rect x="50" y="260" width="260" height="480" rx="28" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="180" cy="345" r="42" fill="#eff6ff"/><text x="180" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#2563eb">你</text><line x1="90" y1="430" x2="270" y2="430" stroke="#bfdbfe" stroke-width="3"/><text x="98" y="545" font-family="Arial,sans-serif" font-size="34" font-weight="600" fill="#111827"><tspan x="98">给我的应用</tspan><tspan x="98" dy="1.45em">加登录功能。</tspan></text><path d="M320 520 H380 M360 500 L390 520 L360 540" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="405" y="230" width="390" height="500" rx="28" fill="#fff" stroke="#93c5fd" stroke-width="3"/><circle cx="475" cy="300" r="38" fill="#2563eb"/><text x="475" y="313" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">AI</text><line x1="407" y1="370" x2="793" y2="370" stroke="#bfdbfe" stroke-width="3"/><text x="450" y="450" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#2563eb">问题：</text><text x="450" y="515" font-family="Arial,sans-serif" font-size="28" fill="#111827"><tspan x="450">你要本地用户名/密码登录，</tspan><tspan x="450" dy="1.45em">还是 Google 登录？</tspan></text><line x1="445" y1="600" x2="755" y2="600" stroke="#bfdbfe" stroke-width="2"/><text x="450" y="655" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#2563eb">提问原因：</text><text x="450" y="710" font-family="Arial,sans-serif" font-size="27" fill="#111827">这个选择会直接改变认证架构。</text><path d="M812 520 H870 M850 500 L880 520 L850 540" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="890" y="260" width="230" height="480" rx="28" fill="#fff" stroke="#2563eb" stroke-width="3"/><circle cx="1005" cy="345" r="42" fill="#eff6ff"/><text x="1005" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="700" fill="#2563eb">你</text><line x1="930" y1="430" x2="1080" y2="430" stroke="#bfdbfe" stroke-width="3"/><text x="938" y="545" font-family="Arial,sans-serif" font-size="32" font-weight="600" fill="#111827"><tspan x="938">本地用户名/</tspan><tspan x="938" dy="1.45em">密码登录。</tspan></text><path d="M1130 520 H1190 M1170 500 L1200 520 L1170 540" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="1210" y="260" width="340" height="480" rx="28" fill="#fff" stroke="#22c55e" stroke-width="3"/><circle cx="1280" cy="330" r="38" fill="#16a34a"/><text x="1280" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">AI</text><line x1="1212" y1="400" x2="1548" y2="400" stroke="#86efac" stroke-width="3"/><text x="1250" y="480" font-family="Arial,sans-serif" font-size="28" font-weight="600" fill="#111827"><tspan x="1250">明白。我会实现最小完整的</tspan><tspan x="1250" dy="1.45em">本地登录流程。</tspan></text><line x1="1248" y1="565" x2="1512" y2="565" stroke="#86efac" stroke-width="2"/><g font-family="Arial,sans-serif" font-size="27" fill="#111827"><text x="1260" y="625">✓ 不引入 OAuth</text><text x="1260" y="680">✓ 不引入 RBAC</text><text x="1260" y="735">✓ 不引入 Redis</text><text x="1260" y="790">✓ 不做无关重构</text></g></svg>